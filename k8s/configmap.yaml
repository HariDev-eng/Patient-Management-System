# configmap.yaml — shared non-sensitive config for all pods
# WHY: one place to change URLs. All pods read from here.
# NOTE: Passwords/secrets are in secret.yaml NOT here
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: patient-management
data:
  # Kafka — "kafka" = the Service name in kafka deployment
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Databases — "postgres" = Service name, 5432 = standard postgres port
  # One Postgres pod, one DATABASE per service (created by postgres-init-configmap.yaml)
  PATIENT_DB_URL: "jdbc:postgresql://postgres:5432/db"
  DOCTOR_DB_URL: "jdbc:postgresql://postgres:5432/doctor_db"
  APPOINTMENT_DB_URL: "jdbc:postgresql://postgres:5432/appointment_db"
  AUTH_DB_URL: "jdbc:postgresql://postgres:5432/auth_db"
  BILLING_DB_URL: "jdbc:postgresql://postgres:5432/billing_db"
  ANALYTICS_DB_URL: "jdbc:postgresql://postgres:5432/analytics_db"
  DIAGNOSIS_DB_URL: "jdbc:postgresql://postgres:5432/diagnosis_db"
  INVENTORY_DB_URL: "jdbc:postgresql://postgres:5432/inventory_db"
  NURSE_DB_URL: "jdbc:postgresql://postgres:5432/nurse_db"
  PRESCRIPTION_DB_URL: "jdbc:postgresql://postgres:5432/prescription_db"

  # Service URLs — used by api-gateway (and any service that calls another)
  AUTH_SERVICE_URL: "http://auth-service:4005"
  PATIENT_SERVICE_URL: "http://patient-service:4000"
  BILLING_SERVICE_URL: "http://billing-service:4001"
  DOCTOR_SERVICE_URL: "http://doctor-svc:4006"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:4007"

  PATIENT_SERVICE_HOST: "patient-service"
  PATIENT_SERVICE_GRPC_PORT: "9001"