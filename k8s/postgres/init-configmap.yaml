# postgres-init-configmap.yaml
# WHY: instead of running 10 separate Postgres pods (one per service),
# we run ONE Postgres pod and create a separate DATABASE per service inside it.
# This still gives each service its own isolated schema/data (no shared tables),
# it's just cheaper to run locally.
#
# HOW: the official postgres image auto-runs any *.sh file found in
# /docker-entrypoint-initdb.d/ on first startup (empty data dir only).
# This script reads POSTGRES_MULTIPLE_DATABASES (comma-separated) and
# creates each one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: patient-management
data:
  init-multiple-dbs.sh: |
    #!/bin/bash
    set -e
    set -u

    function create_database() {
      local database=$1
      echo "  Creating database '$database'"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
          SELECT 'CREATE DATABASE "$database"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$database')\gexec
    EOSQL
    }

    if [ -n "$POSTGRES_MULTIPLE_DATABASES" ]; then
      echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
      IFS=',' read -ra DBS <<< "$POSTGRES_MULTIPLE_DATABASES"
      for db in "${DBS[@]}"; do
        create_database "$db"
      done
      echo "Multiple databases created"
    fi